name: Build release modules

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows modules
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-10
          targets: i686-pc-windows-msvc,x86_64-pc-windows-msvc

      - name: Test
        run: cargo +nightly-2026-08-10 test -p gmod-gabp

      - name: Build x86
        run: cargo +nightly-2026-08-10 build -p gmod-gabp --release --target i686-pc-windows-msvc

      - name: Build x64
        run: cargo +nightly-2026-08-10 build -p gmod-gabp --release --target x86_64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/i686-pc-windows-msvc/release/gmod_gabp.dll dist/gmsv_gabp_win32.dll
          Copy-Item target/i686-pc-windows-msvc/release/gmod_gabp.dll dist/gmcl_gabp_win32.dll
          Copy-Item target/x86_64-pc-windows-msvc/release/gmod_gabp.dll dist/gmsv_gabp_win64.dll
          Copy-Item target/x86_64-pc-windows-msvc/release/gmod_gabp.dll dist/gmcl_gabp_win64.dll

      - name: Upload Windows modules
        uses: actions/upload-artifact@v4
        with:
          name: windows-modules
          path: dist/*.dll
          if-no-files-found: error

  linux:
    name: Linux modules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux x86 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-10
          targets: i686-unknown-linux-gnu,x86_64-unknown-linux-gnu

      - name: Ensure Linux targets
        run: rustup +nightly-2026-08-10 target add i686-unknown-linux-gnu x86_64-unknown-linux-gnu

      - name: Build linux x86
        run: cargo +nightly-2026-08-10 build -p gmod-gabp --release --target i686-unknown-linux-gnu

      - name: Build linux x64
        run: cargo +nightly-2026-08-10 build -p gmod-gabp --release --target x86_64-unknown-linux-gnu

      - name: Package
        run: |
          mkdir -p dist
          cp target/i686-unknown-linux-gnu/release/libgmod_gabp.so dist/gmsv_gabp_linux.dll
          cp target/i686-unknown-linux-gnu/release/libgmod_gabp.so dist/gmcl_gabp_linux.dll
          cp target/x86_64-unknown-linux-gnu/release/libgmod_gabp.so dist/gmsv_gabp_linux64.dll
          cp target/x86_64-unknown-linux-gnu/release/libgmod_gabp.so dist/gmcl_gabp_linux64.dll
          strip dist/*.dll

      - name: Upload Linux modules
        uses: actions/upload-artifact@v4
        with:
          name: linux-modules
          path: dist/*.dll
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download modules
        uses: actions/download-artifact@v4
        with:
          path: dist/modules
          merge-multiple: true

      - name: Package release assets
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          mkdir -p "dist/assets" "dist/installable/lua/bin" "dist/installable/addons/gabp_bridge"

          cp dist/modules/*.dll dist/assets/
          cp dist/modules/*.dll dist/installable/lua/bin/
          cp -R addons/gabp_bridge/. dist/installable/addons/gabp_bridge/

          (
            cd dist/assets
            sha256sum *.dll > SHA256SUMS.txt
          )
          cp dist/assets/SHA256SUMS.txt dist/installable/SHA256SUMS.txt

          cat > dist/installable/README_INSTALL.txt <<'EOF'
          GMod GABP Bridge installable package

          Copy the contents of this archive into a Garry's Mod or SRCDS
          garrysmod directory. The package contains:

          - addons/gabp_bridge
          - lua/bin server modules: gmsv_gabp_*
          - lua/bin client modules: gmcl_gabp_*

          A dedicated server only needs the gmsv_* module that matches its
          platform and architecture. A client only needs the gmcl_* module that
          matches its platform and architecture.
          EOF

          (
            cd dist/installable
            zip -r "../gmod-gabp-${tag}-installable.zip" .
          )

          (
            cd dist/assets
            zip "../gmod-gabp-${tag}-modules.zip" *.dll SHA256SUMS.txt
          )

      - name: Write release notes
        run: |
          tag="${GITHUB_REF_NAME}"
          cat > dist/release-notes.md <<EOF
          ## GMod GABP Bridge ${tag}

          Native bridge modules ready to install under \`garrysmod/lua/bin\`.

          ### Assets

          - \`gmod-gabp-${tag}-installable.zip\`: addon plus all server/client modules in install-ready layout.
          - \`gmod-gabp-${tag}-modules.zip\`: all DLL modules plus \`SHA256SUMS.txt\`.
          - Individual server/client modules for Windows x86/x64 and Linux x86/x64.

          ### Module Names

          - Windows x86: \`gmsv_gabp_win32.dll\`, \`gmcl_gabp_win32.dll\`
          - Windows x64: \`gmsv_gabp_win64.dll\`, \`gmcl_gabp_win64.dll\`
          - Linux x86: \`gmsv_gabp_linux.dll\`, \`gmcl_gabp_linux.dll\`
          - Linux x64: \`gmsv_gabp_linux64.dll\`, \`gmcl_gabp_linux64.dll\`

          ### Validation

          This release was built by GitHub Actions from tag \`${tag}\`. The workflow runs the Rust test suite and builds Windows and Linux modules.
          EOF

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release edit "${tag}" \
              --title "GMod GABP Bridge ${tag}" \
              --notes-file dist/release-notes.md
          else
            gh release create "${tag}" \
              --title "GMod GABP Bridge ${tag}" \
              --notes-file dist/release-notes.md
          fi

          gh release upload "${tag}" --clobber \
            dist/gmod-gabp-${tag}-installable.zip \
            dist/gmod-gabp-${tag}-modules.zip \
            dist/assets/SHA256SUMS.txt \
            dist/assets/*.dll
